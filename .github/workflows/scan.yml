name: scan-repo-secrets

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Scan working tree for real network data and forbidden files
        run: python3 tools/scan_repo_secrets.py
